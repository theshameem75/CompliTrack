<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in · CompliTrack</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .auth-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8f8fb;
      }
      .auth-card {
        width: min(420px, calc(100% - 32px));
        background: #fff;
        padding: 34px;
        border: 1px solid #ebeaf0;
        border-radius: 14px;
        box-shadow: 0 15px 50px #312b6412;
      }
      .auth-brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font: 700 20px "Plus Jakarta Sans";
        margin-bottom: 28px;
      }
      .auth-brand strong {
        color: #6957e8;
      }
      .auth-card h1 {
        font: 700 23px "Plus Jakarta Sans";
        margin: 0 0 7px;
      }
      .auth-card p {
        color: #88869a;
        margin: 0 0 22px;
      }
      .auth-card label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        margin: 15px 0 6px;
      }
      .auth-card input {
        width: 100%;
        padding: 12px;
        border: 1px solid #e1e0e8;
        border-radius: 7px;
        font: 13px "DM Sans";
      }
      .auth-card form button {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        border: 0;
        border-radius: 7px;
        background: #6957e8;
        color: #fff;
      }
      .auth-links {
        display: flex;
        justify-content: space-between;
        margin-top: 18px;
      }
      .auth-links button {
        background: none;
        color: #6957e8;
        padding: 0;
        margin: 0;
        border: 0;
      }
      .auth-message {
        margin-top: 16px;
        color: #d96860;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card">
        <div class="auth-brand">
          <span class="mark">✓</span><span>compli<strong>track</strong></span>
        </div>
        <div id="authContent"></div>
        <div id="authMessage" class="auth-message" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="auth.js"></script>
  </body>
</html>
